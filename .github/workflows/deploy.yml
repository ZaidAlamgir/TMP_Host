name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  repository_dispatch:
    types: [new-article-post, new-infolens-post]

permissions:
  contents: read
  deployments: write

# the Node 20 warning
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Main Repo (TMP_Host)
        uses: actions/checkout@v4
        with:
          repository: zaidalamgir/TMP_Host
          token: ${{ secrets.GITHUB_TOKEN }}
          path: ./main_site
          fetch-depth: 1

      - name: 2. Create Staging Directories
        run: |
          mkdir -p ./main_site/_posts
          mkdir -p ./_article_repos
        
      # --- CHECKOUT STEPS ---
      - name: 3. Checkout World Politics
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-world-politics
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/world-politics
          fetch-depth: 1

      - name: 4. Checkout Indian Politics
        uses: actions/checkout@v4
