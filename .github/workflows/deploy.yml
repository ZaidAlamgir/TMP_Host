      - name: 36. Checkout Wildlife
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-wild-life
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/wild-life
          fetch-depth: 1

      - name: 37. Checkout Discoveries & Inventions
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-discoveries-and-inventions
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/discoveries-and-inventions
          fetch-depth: 1

      - name: 38. Checkout Minorities
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-minorities
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/minorities
          fetch-depth: 1

      - name: 39. Checkout Fact Check
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-fact-check
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/fact-check
          fetch-depth: 1

      - name: 40. Checkout Analysis
        uses: actions/checkout@v4
        with:
          repository: TheMuslimPost/tmp-articles-analysis
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/analysis
          fetch-depth: 1

      # --- USER POSTS (POOLED WRITERS: 100 USERS PER REPO) ---
      - name: 40b. Checkout User Posts (Pool 1)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: TheMuslimPost/user-posts
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/user-posts
          fetch-depth: 1

      - name: 40c. Checkout User Posts (Pool 2)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: TheMuslimPost/user-posts-02
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/user-posts-02
          fetch-depth: 1

      # --- INFOLENS CHECKOUT ---
      - name: 40d. Checkout InfoLens SVG Infographics
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: TheMuslimPost/tmp-articles-infolens
          token: ${{ secrets.GH_PAT_FOR_CHECKOUT }}
          path: ./_article_repos/infolens
          fetch-depth: 1

      # --- CONSOLIDATION (OPTION B: LAST 60 DAYS ONLY) ---
      - name: 41. Consolidate Active Posts (< 60 Days)
        run: |
          echo "--- Starting Option B Active Post Consolidation (< 60 Days) ---"
          mkdir -p ./main_site/_posts
          python3 ./main_site/scripts/consolidate_active_posts.py --src ./_article_repos --dest ./main_site/_posts --days 60
          echo "--- Active Posts in _posts for Jekyll build: ---"
          ls -1 ./main_site/_posts | wc -l

      - name: 41b. Consolidate InfoLens SVG Infographics (< 60 Days)
        run: |
          echo "--- Consolidating InfoLens SVG Infographics ---"
          python3 ./main_site/scripts/consolidate_infolens.py --src ./_article_repos/infolens/posts --dest-json ./main_site/infolens.json --dest-site-json ./main_site/_site/infolens.json --days 60
      
      - name: 42. Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: ./main_site 
          
      - name: 43. Build with Jekyll
        run: JEKYLL_ENV=production bundle exec jekyll build --trace
        working-directory: ./main_site 

      # --- ASSET LINKS FIX ---
      - name: 43b. Setup AssetLinks Rewrite for Cloudflare
        run: |
          echo "Setting up AssetLinks Rewrite..."
          cp .well-known/assetlinks.json _site/assetlinks.json
          mkdir -p _site/.well-known
          cp .well-known/assetlinks.json _site/.well-known/
          echo "/.well-known/assetlinks.json /assetlinks.json 200" >> _site/_redirects
          echo "AssetLinks rewrite setup complete."
        working-directory: ./main_site
        
      - name: 44. Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: jekyll-site
          path: ./main_site/_site
          retention-days: 1

  # --- SEPARATE DEPLOY JOB ---
  deploy:
    runs-on: ubuntu-latest
    needs: build 
    permissions:
      contents: read
      deployments: write
    steps:
      # 1. NEW: Download Source Code (Crucial for 'functions' folder)
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Download the Built Site (Contains your .well-known/assetlinks.json)
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: jekyll-site
          # This downloads the site to a folder named '_site' in the current directory
          path: ./_site
          
      # 3. Deploy (with automatic retry for transient Cloudflare API errors)
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        id: deploy1
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }} 
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} 
          # Wrangler will automatically find the 'functions' folder in the root
          # and deploy it alongside the './_site' static assets
          command: pages deploy ./_site --project-name=tmp-host

      - name: Wait before retry on Cloudflare API error
        if: steps.deploy1.outcome == 'failure'
        run: sleep 10

      - name: Deploy to Cloudflare Pages (Retry)
        if: steps.deploy1.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }} 
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }} 
          command: pages deploy ./_site --project-name=tmp-host