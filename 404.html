---
layout: default
title: Page Not Found
permalink: /404.html
---

<div class="content-wrapper" style="text-align: center; padding: 4rem 1.5rem; max-width: 720px; margin: 0 auto;">
    <div style="font-size: 4rem; font-weight: 800; color: #dc2626; margin-bottom: 0.5rem;">404</div>
    <h1 style="font-size: 1.85rem; font-weight: 700; margin-bottom: 1rem; color: #1e293b;">Article Not Found Locally</h1>
    <p id="local-redirect-status" style="font-size: 1rem; color: #64748b; line-height: 1.6; margin-bottom: 2rem;">
        The requested page does not exist in the local static build. In production, older articles are served dynamically from Cloudflare D1.
    </p>
    <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
        <a id="live-article-btn" href="https://www.tmpnews.com" class="explore-hub-btn" style="display: none;">
            <i class="fas fa-external-link-alt mr-1"></i> Open on Live TMP News
        </a>
        <a href="{{ '/' | relative_url }}" class="explore-hub-btn" style="background: #475569;">
            <i class="fas fa-home mr-1"></i> Return to Homepage
        </a>
    </div>
</div>

<script>
(function() {
    const path = window.location.pathname;
    const isLocal = window.location.hostname === 'localhost' || 
                    window.location.hostname === '127.0.0.1' || 
                    /^\d+\.\d+\.\d+\.\d+$/.test(window.location.hostname);

    if (isLocal && path.startsWith('/news/')) {
        const liveUrl = 'https://www.tmpnews.com' + path;
        const statusEl = document.getElementById('local-redirect-status');
        const liveBtn = document.getElementById('live-article-btn');
        if (statusEl) {
            statusEl.innerHTML = 'This is an archived article stored in Cloudflare D1. Redirecting to live article on <strong>tmpnews.com</strong> in 1 second...';
        }
        if (liveBtn) {
            liveBtn.href = liveUrl;
            liveBtn.style.display = 'inline-flex';
        }
        setTimeout(() => {
            window.location.replace(liveUrl);
        }, 1200);
    }
})();
</script>
